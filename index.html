<!doctype html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Js Dom</title>
          <link rel="stylesheet" href="./assets/style.css" />
     </head>
     <body>
          <div class="container">
               <div class="logo">
                    <img src="" alt="logo" />
                    <h1>To Do App</h1>
               </div>
               <div class="add-task">
                    <form>
                    <label for="new-task">Add New Task</label>
                    <input type="text" name="text" id="new-task"/>
                    <input type="button" value="Add Task" />
                    </form>
               </div>
               <div class="task-group">
                    <div class="incomplete-task">
                         <h2>Incomplete Task</h2>
                         <hr />
                         <ul id="items">
                              <li class="item">
                                   <input type="checkbox" /><label>Task Name</label>
                              </li>
                              <li class="item">
                                   <input type="checkbox" /><label>Task Name</label>
                              </li>
                              <li class="item">
                                   <input type="checkbox" id="task3"/><label for="task3">Task Name</label>
                              </li>
                         </ul>
                    </div>
                    <div class="complete-task">
                         <h2>Complete Task</h2>
                         <hr />
                         <ul>
                              <li class="item">Task Name <button class="delete">Delete</button></li>
                         </ul>
                    </div>
               </div>
          </div>

          <script src="./assets/app.js"></script>
     </body>
</html>
